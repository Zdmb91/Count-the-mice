<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted Yard - Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --floor-bg: #1a1124;
            --accent-orange: #ff7518;
            --accent-crimson: #990000;
            --text-light: #e0e0e0;
            --ground-color: #0d0d0d;
        }
        body { 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-color); 
            /* Huge centered moon and gothic night sky */
            background-image: 
                radial-gradient(circle at 50% 25%, #fffacd 0%, #fffacd 100px, transparent 102px), 
                radial-gradient(circle at 50% 25%, rgba(255, 250, 205, 0.2) 0%, rgba(138, 43, 226, 0.1) 250px, transparent 350px), 
                linear-gradient(to bottom, #0f0c29, #302b63, #0b0c10); 
            color: var(--text-light); min-height: 100vh;
            overflow: hidden; position: relative;
        }

        #haunted-scene {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 20px; z-index: 10; pointer-events: none;
        }
        
        /* Cobwebs in the top corners */
        body::before, body::after {
            content: '🕸️'; position: absolute; font-size: 150px; opacity: 0.15; z-index: 0; pointer-events: none;
        }
        body::before { top: -40px; left: -20px; transform: rotate(-45deg); }
        body::after { top: -40px; right: -20px; transform: rotate(45deg); }
        
        /* Dark Ground */
        #ground-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100px;
            background: var(--ground-color);
            background-image: radial-gradient(circle at 50% 100%, #1a1a1a 0%, var(--ground-color) 100%);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9); z-index: 2;
        }

        /* Rolling Fog Layer */
        #fog-layer {
            position: absolute; bottom: 80px; left: 0; width: 100%; height: 80px;
            background: linear-gradient(to top, rgba(200, 200, 200, 0.15), transparent);
            filter: blur(8px); z-index: 6; pointer-events: none;
        }
        
        /* Spooky Entities */
        .spooky-entity { position: absolute; opacity: 0.7; z-index: 15; pointer-events: none; }
        .g-entity { font-size: 55px; animation: floatGhost 7s ease-in-out infinite; }
        .b-entity { font-size: 40px; animation: flightBat 4s linear infinite; }
        
        @keyframes floatGhost {
            0%, 100% { transform: translate(0) rotate(0deg); opacity: 0.4; }
            30% { transform: translate(-15px, -20px) rotate(5deg); opacity: 0.7; }
            60% { transform: translate(20px, 15px) rotate(-3deg); opacity: 0.5; }
        }
        
        @keyframes flightBat {
            0% { transform: translate(-20%, 0) rotate(0deg) scale(1); }
            50% { transform: translate(120%, -50px) rotate(10deg) scale(0.8); }
            100% { transform: translate(-20%, 0) rotate(0deg) scale(1); }
        }

        /* Wrought Iron Cemetery Fence (Addams Family Vibe) */
        #iron-fence {
            position: absolute; bottom: 85px; left: 0; width: 100%; height: 60px;
            background-image: 
                repeating-linear-gradient(90deg, #050505 0px, #050505 5px, transparent 5px, transparent 40px),
                linear-gradient(to bottom, transparent 15px, #050505 15px, #050505 20px, transparent 20px, transparent 40px, #050505 40px, #050505 45px, transparent 45px);
            z-index: 5; box-shadow: 0 -5px 15px rgba(0,0,0,0.8);
        }
        
        /* Teen Wolf Element */
        #teenwolf {
            position: absolute; bottom: 85px; left: 18%; font-size: 70px; z-index: 7;
            transform: scaleX(-1); animation: howl 6s infinite alternate;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        @keyframes howl {
            0%, 70% { transform: scaleX(-1) rotate(0deg) translateY(0); }
            100% { transform: scaleX(-1) rotate(-15deg) translateY(-5px); }
        }

        /* Graveyard Headstones */
        .graveyard { position: absolute; bottom: 80px; width: 100%; height: 1px; z-index: 4; text-align: center; }
        .headstone { position: absolute; opacity: 0.8; font-size: 40px; filter: grayscale(50%) brightness(70%); }
        .hs1 { left: 8%; bottom: 10px; }
        .hs2 { right: 12%; bottom: 0px; transform: rotate(-8deg); }
        .hs3 { left: 28%; bottom: 5px; transform: rotate(4deg); }
        .hs4 { right: 25%; bottom: 12px; }
        
        /* Main Game Board */
        #game-board { 
            width: 100%; max-width: 900px; display: flex; flex-direction: column-reverse; 
            align-items: center; z-index: 20; position: relative; pointer-events: none;
        }
        
        /* Tall Gothic Mansion Roof */
        #house-roof {
            width: 0; height: 0; border-left: 200px solid transparent; border-right: 200px solid transparent;
            border-bottom: 180px solid #0f0714; margin-bottom: -5px; display: none; 
            position: relative;
        }
        /* Glowing Attic Window */
        #house-roof::before {
            content: ''; position: absolute; top: 90px; left: -25px; width: 50px; height: 70px;
            background: rgba(255, 215, 0, 0.6); border-radius: 25px 25px 0 0;
            border: 5px solid #000; box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: flicker 4s infinite alternate;
        }
        /* Weather vane bat */
        #house-roof::after { 
            content: '🦇'; position: absolute; top: -35px; left: -18px; font-size: 35px; opacity: 0.9;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .floor { 
            width: 100%; border: 4px solid #2d1b38; border-bottom: 10px solid #110917;
            margin-bottom: -4px; background: var(--floor-bg); min-height: 110px; 
            position: relative; box-shadow: inset 0 0 40px rgba(0,0,0,1), 0 5px 15px rgba(0,0,0,0.8);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.3) 40px, rgba(0,0,0,0.3) 45px);
        }

        .floor-title { 
            font-family: 'Creepster', cursive; background: rgba(0, 0, 0, 0.9); 
            color: var(--accent-orange); margin: 0; padding: 5px 15px; 
            font-size: 24px; letter-spacing: 2px; text-shadow: 2px 2px 4px #000; border-bottom: 2px solid #2d1b38;
            display: flex; justify-content: space-between;
        }
        .team-container { display: flex; flex-wrap: wrap; padding: 15px; gap: 10px; }
        
        /* Varsity Crimson Badges */
        .team-avatar { 
            background: var(--accent-crimson); color: #fff; padding: 8px 15px; 
            border: 2px solid #000; border-radius: 5px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,1); 
        }
    </style>
</head>
<body>
    
    <!-- Spooky Floating Entities -->
    <div class="spooky-entity g-entity g1" style="top: 25%; left: 10%;">👻</div>
    <div class="spooky-entity g-entity g2" style="top: 45%; right: 15%;">👻</div>
    <div class="spooky-entity b-entity b1" style="top: 15%; right: 25%; animation-delay: 0s;">🦇</div>
    <div class="spooky-entity b-entity b2" style="top: 30%; left: 20%; animation-delay: 1.5s;">🦇</div>
    <div class="spooky-entity b-entity b1" style="top: 10%; right: 5%; animation-delay: 3s;">🦇</div>

    <!-- Scenery Layers -->
    <div class="graveyard">
        <span class="headstone hs1">🪦</span>
        <span class="headstone hs2">🪦</span>
        <span class="headstone hs3">🪦</span>
        <span class="headstone hs4">🪦</span>
    </div>

    <div id="teenwolf">🐺</div>
    <div id="iron-fence"></div>
    <div id="fog-layer"></div>
    <div id="ground-layer"></div>
    
    <!-- Game Board -->
    <div id="haunted-scene">
        <div id="game-board"></div>
    </div>

    <script>
        const MAX_TOTAL_FLOORS = 8;
        
        const floorNames = [
            "The Crypt (Waiting Room)",
            "Count the Mice",
            "The Phantom's Violin",
            "The Hall of Mirrors",
            "Blindfolded Pumpkin Sculpting",
            "The Mirror Trap",
            "Spot the Differences",
            "Spot the Similarities",
            "The Crypt Keeper's Truth"
        ];
        
        let defaultTeams = Array.from({length: 8}, (_, i) => ({ id: i+1, name: `Team ${i+1}`, floor: 0 }));
        
        function renderBoard() {
            let teams = JSON.parse(localStorage.getItem('hauntedGameData')) || defaultTeams;
            const board = document.getElementById("game-board");
            
            board.innerHTML = '<div id="house-roof"></div>';
            const roof = document.getElementById("house-roof");
            let maxFloor = Math.max(0, ...teams.map(t => t.floor));

            if (maxFloor >= 0) roof.style.display = 'block';

            for (let i = 0; i <= maxFloor && i <= MAX_TOTAL_FLOORS; i++) {
                const floorDiv = document.createElement("div");
                floorDiv.className = "floor";
                floorDiv.style.width = `${100 - (i * 3)}%`;
                
                const title = document.createElement("div");
                title.className = "floor-title";
                let currentFloorName = floorNames[i] || `Floor ${i}`;
                title.innerHTML = `<span>${currentFloorName}</span> <span>🕯️</span>`;
                floorDiv.appendChild(title);

                const teamContainer = document.createElement("div");
                teamContainer.className = "team-container";
                
                teams.filter(t => t.floor === i).forEach(t => {
                    const avatar = document.createElement("div");
                    avatar.className = "team-avatar";
                    avatar.innerText = t.name;
                    teamContainer.appendChild(avatar);
                });

                floorDiv.appendChild(teamContainer);
                board.appendChild(floorDiv);
            }
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'hauntedGameData') renderBoard();
        });

        renderBoard();
    </script>
</body>
</html>
