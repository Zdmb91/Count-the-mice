<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted Yard - Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --floor-bg: #1a1124;
            --accent-orange: #ff7518;
            --accent-crimson: #990000;
            --text-light: #e0e0e0;
            --ground-color: #0d0d0d;
        }
        body { 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-color); 
            background-image: linear-gradient(to bottom, #0f0c29, #302b63, #0b0c10); 
            color: var(--text-light); 
            height: 100vh;
            overflow: hidden; 
        }

        #detailed-moon {
            position: absolute;
            top: 5%; right: 10%;
            width: 250px; height: 250px;
            border-radius: 50%;
            background-color: #e0e0d1;
            box-shadow: 
                inset -25px -25px 40px rgba(0,0,0,0.5), 
                inset 10px 10px 20px rgba(255,255,255,0.9),
                0 0 60px 15px rgba(255, 250, 205, 0.3);
            background-image: 
                radial-gradient(circle at 35% 25%, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.15) 12%, transparent 15%),
                radial-gradient(circle at 65% 55%, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.2) 18%, transparent 22%),
                radial-gradient(circle at 30% 70%, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.15) 8%, transparent 12%),
                radial-gradient(circle at 75% 25%, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.1) 10%, transparent 14%);
            z-index: 1;
        }

        body::before, body::after {
            content: '🕸️'; position: absolute; font-size: 120px; opacity: 0.15; z-index: 0; pointer-events: none;
        }
        body::before { top: -30px; left: -20px; transform: rotate(-45deg); }
        body::after { top: -30px; right: -20px; transform: rotate(45deg); }

        .spooky-entity { position: absolute; opacity: 0.7; z-index: 5; pointer-events: none; }
        .g-entity { font-size: 45px; animation: floatGhost 7s ease-in-out infinite; }
        .b-entity { font-size: 35px; animation: flightBat 4s linear infinite; }
        
        @keyframes floatGhost {
            0%, 100% { transform: translate(0) rotate(0deg); opacity: 0.4; }
            30% { transform: translate(-15px, -20px) rotate(5deg); opacity: 0.7; }
            60% { transform: translate(20px, 15px) rotate(-3deg); opacity: 0.5; }
        }
        @keyframes flightBat {
            0% { transform: translate(-20%, 0) rotate(0deg) scale(1); }
            50% { transform: translate(120%, -50px) rotate(10deg) scale(0.8); }
            100% { transform: translate(-20%, 0) rotate(0deg) scale(1); }
        }

        #scroll-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            overflow-y: auto; overflow-x: hidden; z-index: 20;
        }

        #scene-content {
            width: 100%; min-height: 100%;
            display: flex; flex-direction: column; align-items: center;
        }

        #game-board { 
            margin-top: auto; 
            margin-bottom: 100px;
            padding-top: 20px; 
            width: 100%; max-width: 800px; 
            display: flex; flex-direction: column-reverse; 
            align-items: center; position: relative; pointer-events: none;
        }
        
        #foreground {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 120px;
            z-index: 30; pointer-events: none;
        }

        #ground-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70px;
            background: var(--ground-color);
            background-image: radial-gradient(circle at 50% 100%, #1a1a1a 0%, var(--ground-color) 100%);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
        }
        #fog-layer {
            position: absolute; bottom: 50px; left: 0; width: 100%; height: 60px;
            background: linear-gradient(to top, rgba(200, 200, 200, 0.15), transparent);
            filter: blur(8px);
        }
        #iron-fence {
            position: absolute; bottom: 55px; left: 0; width: 100%; height: 45px;
            background-image: 
                repeating-linear-gradient(90deg, #050505 0px, #050505 4px, transparent 4px, transparent 35px),
                linear-gradient(to bottom, transparent 10px, #050505 10px, #050505 14px, transparent 14px, transparent 30px, #050505 30px, #050505 34px, transparent 34px);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.8);
        }
        #teenwolf {
            position: absolute; bottom: 55px; left: 18%; font-size: 55px;
            transform: scaleX(-1); animation: howl 6s infinite alternate;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }
        @keyframes howl {
            0%, 70% { transform: scaleX(-1) rotate(0deg) translateY(0); }
            100% { transform: scaleX(-1) rotate(-15deg) translateY(-5px); }
        }
        .graveyard { position: absolute; bottom: 50px; width: 100%; height: 1px; text-align: center; }
        .headstone { position: absolute; opacity: 0.8; font-size: 35px; filter: grayscale(50%) brightness(70%); }
        .hs1 { left: 8%; bottom: 10px; }
        .hs2 { right: 12%; bottom: 0px; transform: rotate(-8deg); }
        .hs3 { left: 28%; bottom: 5px; transform: rotate(4deg); }
        .hs4 { right: 25%; bottom: 12px; }
        
        #house-roof {
            width: 0; height: 0; border-left: 180px solid transparent; border-right: 180px solid transparent;
            border-bottom: 90px solid #0f0714; margin-bottom: -3px; display: none; 
            position: relative;
        }
        #house-roof::before {
            content: ''; position: absolute; top: 35px; left: -20px; width: 40px; height: 50px;
            background: rgba(255, 215, 0, 0.6); border-radius: 20px 20px 0 0;
            border: 4px solid #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            animation: flicker 4s infinite alternate;
        }
        #house-roof::after { 
            content: '🦇'; position: absolute; top: -30px; left: -14px; font-size: 28px; opacity: 0.9;
        }
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .floor { 
            width: 100%; border: 4px solid #2d1b38; border-bottom: 6px solid #110917;
            margin-bottom: -3px; background: var(--floor-bg); min-height: 50px; 
            position: relative; box-shadow: inset 0 0 30px rgba(0,0,0,1), 0 3px 10px rgba(0,0,0,0.8);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(0,0,0,0.3) 30px, rgba(0,0,0,0.3) 35px);
        }

        .floor-title { 
            font-family: 'Creepster', cursive; background: rgba(0, 0, 0, 0.9); 
            color: var(--accent-orange); margin: 0; padding: 2px 10px; 
            font-size: 16px; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; border-bottom: 2px solid #2d1b38;
            display: flex; justify-content: space-between;
        }
        .team-container { display: flex; flex-wrap: wrap; padding: 6px 10px; gap: 6px; }
        
        .team-avatar { 
            background: var(--accent-crimson); color: #fff; padding: 4px 8px; 
            border: 2px solid #000; border-radius: 4px; font-size: 11px; font-weight: bold; box-shadow: 0 3px 5px rgba(0,0,0,1); 
        }

        /* --- Winner Celebration Overlay --- */
        #winner-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); z-index: 100;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }
        #winner-title {
            font-family: 'Creepster', cursive; color: #ffcc00; font-size: 80px; margin: 0;
            animation: pulseGold 1.5s infinite alternate; text-transform: uppercase;
        }
        #winner-sub { font-size: 30px; color: #fff; margin-top: 10px; font-weight: bold; text-shadow: 2px 2px 5px #000; }
        .celebration-emoji { font-size: 60px; margin: 20px; animation: bounce 1s infinite alternate; display: inline-block; }
        
        @keyframes pulseGold {
            0% { text-shadow: 0 0 10px gold; transform: scale(1); }
            100% { text-shadow: 0 0 30px #ff7518, 0 0 50px gold; transform: scale(1.05); }
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-30px); }
        }
    </style>
</head>
<body>
    
    <div id="winner-overlay">
        <div>
            <span class="celebration-emoji" style="animation-delay: 0s;">🎃</span>
            <span class="celebration-emoji" style="animation-delay: 0.2s;">🏆</span>
            <span class="celebration-emoji" style="animation-delay: 0.4s;">🎃</span>
        </div>
        <h1 id="winner-title"></h1>
        <div id="winner-sub">Has Escaped the Haunted House!</div>
    </div>

    <div id="detailed-moon"></div>

    <div class="spooky-entity g-entity g1" style="top: 20%; left: 8%;">👻</div>
    <div class="spooky-entity g-entity g2" style="top: 35%; right: 18%;">👻</div>
    <div class="spooky-entity b-entity b1" style="top: 15%; right: 35%; animation-delay: 0s;">🦇</div>
    <div class="spooky-entity b-entity b2" style="top: 25%; left: 15%; animation-delay: 1.5s;">🦇</div>
    <div class="spooky-entity b-entity b1" style="top: 8%; right: 5%; animation-delay: 3s;">🦇</div>

    <div id="scroll-container">
        <div id="scene-content">
            <div id="game-board"></div>
        </div>
    </div>

    <div id="foreground">
        <div class="graveyard">
            <span class="headstone hs1">🪦</span>
            <span class="headstone hs2">🪦</span>
            <span class="headstone hs3">🪦</span>
            <span class="headstone hs4">🪦</span>
        </div>
        <div id="teenwolf">🐺</div>
        <div id="iron-fence"></div>
        <div id="fog-layer"></div>
        <div id="ground-layer"></div>
    </div>

    <script>
        const MAX_TOTAL_FLOORS = 8;
        
        // Viewer Names (Hidden Numbers)
        const floorNames = [
            "The Crypt",
            "Count the Mice",
            "The Phantom's Violin",
            "The Hall of Mirrors",
            "Blindfolded Pumpkin Sculpting",
            "The Mirror Trap",
            "Spot the Differences",
            "Spot the Similarities",
            "The Crypt Keeper's Truth"
        ];
        
        let defaultTeams = Array.from({length: 8}, (_, i) => ({ id: i+1, name: `Team ${i+1}`, floor: 0 }));
        
        function renderBoard() {
            let teams = JSON.parse(localStorage.getItem('hauntedGameData')) || defaultTeams;
            let unlockedFloor = parseInt(localStorage.getItem('hauntedUnlockedFloor')) || 0;
            
            let currentMax = Math.max(0, ...teams.map(t => t.floor));
            if (currentMax > unlockedFloor) {
                unlockedFloor = currentMax;
                localStorage.setItem('hauntedUnlockedFloor', unlockedFloor);
            }

            const board = document.getElementById("game-board");
            board.innerHTML = '<div id="house-roof"></div>';
            const roof = document.getElementById("house-roof");

            if (unlockedFloor >= 0) roof.style.display = 'block';

            for (let i = 0; i <= unlockedFloor && i <= MAX_TOTAL_FLOORS; i++) {
                const floorDiv = document.createElement("div");
                floorDiv.className = "floor";
                floorDiv.style.width = `${100 - (i * 3)}%`;
                
                const title = document.createElement("div");
                title.className = "floor-title";
                let currentFloorName = floorNames[i] || `Floor ${i}`;
                title.innerHTML = `<span>${currentFloorName}</span> <span>🕯️</span>`;
                floorDiv.appendChild(title);

                const teamContainer = document.createElement("div");
                teamContainer.className = "team-container";
                
                teams.filter(t => t.floor === i).forEach(t => {
                    const avatar = document.createElement("div");
                    avatar.className = "team-avatar";
                    avatar.innerText = t.name;
                    teamContainer.appendChild(avatar);
                });

                floorDiv.appendChild(teamContainer);
                board.appendChild(floorDiv);
            }

            // Check Winner State
            const winnerName = localStorage.getItem('hauntedWinnerName');
            const overlay = document.getElementById('winner-overlay');
            if (winnerName) {
                document.getElementById('winner-title').innerText = winnerName;
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'hauntedGameData' || e.key === 'hauntedUnlockedFloor' || e.key === 'hauntedWinnerName') {
                renderBoard();
            }
        });

        renderBoard();
    </script>
</body>
</html>
