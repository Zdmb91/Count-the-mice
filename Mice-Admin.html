<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted House - Admin Dashboard</title>
    <!-- Include Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 15px; margin: 0; display: flex; justify-content: center; }
        
        #admin-panel { 
            background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.1); 
            width: 100%; max-width: 1350px; 
            display: flex; flex-direction: column; height: 93vh; box-sizing: border-box;
        }

        h2 { margin: 0 0 10px 0; font-size: 20px; color: #222; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
            overflow: hidden;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: calc(93vh - 80px);
            padding-right: 5px;
        }
        
        .admin-section { background: #e9ecef; padding: 12px; border-radius: 6px; }
        .section-title { font-weight: bold; font-size: 15px; border-bottom: 2px solid #ccc; padding-bottom: 5px; margin-bottom: 8px; color: #333; }
        
        .queue-display { font-size: 13px; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; color: #555; }
        .queue-arrow { color: #ff7518; margin: 0 5px; }
        .queue-target { font-size: 11px; color: #888; font-weight: normal; }
        
        .floor-call-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
        .floor-call-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; }
        .floor-call-name { font-weight: bold; font-size: 12px; color: #444; }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        .btn-call-ready { background: #28a745; font-size: 11px; padding: 5px 8px; color: #fff; border: 1px solid #1e7e34; animation: pulse-green 2s infinite; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .btn-disabled { background: #6c757d; font-size: 11px; padding: 5px 8px; cursor: not-allowed; opacity: 0.6; border: none; color: #fff; font-weight: bold; border-radius: 3px; }
        
        .admin-team { display: flex; align-items: center; margin-bottom: 6px; justify-content: space-between; background: #fff; padding: 6px; border-radius: 4px; border: 1px solid #ccc;}
        .admin-team input { flex: 1; margin: 0 6px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        .floor-label { width: 150px; text-align: left; padding-left: 6px; font-size: 11px; color: #444; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        button { cursor: pointer; padding: 6px 10px; font-weight: bold; color: white; border: none; border-radius: 3px; }
        
        .btn-win-room { background: #28a745; width: 65px; font-size: 11px; padding: 5px; }
        .btn-lose-room { background: #dc3545; width: 65px; font-size: 11px; padding: 5px; }
        .btn-tgt { background: #6c757d; width: 50px; font-size: 11px; padding: 5px; }
        .btn-force { background: #17a2b8; margin-left: 4px; font-size: 11px; padding: 5px 8px;}
        .btn-overall-win { background: #ffc107; color: #000; margin-left: 4px; border: 1px solid #d39e00; font-size: 12px; padding: 5px 6px;}
        
        .global-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-add { background: #17a2b8; flex: 1; padding: 8px; font-size: 13px; }
        .btn-reset { background: #ff7518; flex: 1; padding: 8px; font-size: 13px; }
    </style>
</head>
<body>
    <div id="admin-panel">
        <h2>Admin Controls Dashboard (Cloud Synced)</h2>
        
        <div class="dashboard-grid">
            <div class="column">
                <div class="admin-section" style="background:#fff3cd; border: 1px solid #ffeeba;">
                    <div class="section-title">The Crypt Queue</div>
                    <div class="queue-display" id="queue-box">Loading...</div>
                </div>

                <div class="admin-section">
                    <div class="section-title">Auto-Call to Rooms</div>
                    <div class="floor-call-grid" id="floor-call-box"></div>
                </div>
            </div>

            <div class="column">
                <div class="admin-section">
                    <div class="section-title">Team Management & Outcomes</div>
                    <div id="team-mgmt-box"></div>
                </div>
            </div>
        </div>

        <div class="global-actions">
            <button class="btn-add" onclick="addTeam()">+ Add New Team</button>
            <button class="btn-reset" onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://alchlikgtmkpghujvgcn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsY2hsaWtndG1rcGh1anZnY24iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MjQyNzQwNywiZXhwIjoyMODAwMzQwN30.PUrYlqwiu1NflpUdz2OCj5_zen1MM3aH5vi5PGrp_E4';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const MAX_TOTAL_FLOORS = 8;
        const floorCapacities = [10, 10, 1, 1, 1, 1, 1, 2]; 
        
        const floorNames = [
            "The Crypt (Waiting Room)",
            "Floor 1: Count the Mice",
            "Floor 2: The Phantom's Parlor",
            "Floor 3: The Hall of Mirrors",
            "Floor 4: Blindfolded Pumpkin Sculpting",
            "Floor 5: The Mirror Trap",
            "Floor 6: Spot the Differences",
            "Floor 7: Spot the Similarities",
            "Floor 8: The Crypt Keeper's Truth"
        ];

        let gameState = {
            teams: [],
            unlockedFloor: 0,
            winnerName: null
        };

        // Fetch state from Supabase on load
        async function fetchState() {
            try {
                const { data, error } = await dbClient
                    .from('game_state')
                    .select('data')
                    .eq('id', 1)
                    .single();
                
                if (data && data.data) {
                    gameState = data.data;
                    renderAdmin();
                } else {
                    console.error("No data returned from Supabase:", error);
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        // Push updated state to Supabase
        async function saveState() {
            renderAdmin(); // Immediate local render for responsiveness
            await dbClient
                .from('game_state')
                .update({ data: gameState })
                .eq('id', 1);
        }

        function renderAdmin() {
            const teams = gameState.teams || [];
            
            // 1. Queue Box
            const cryptTeams = teams.filter(t => t.floor === 0).sort((a, b) => a.queueTime - b.queueTime);
            document.getElementById("queue-box").innerHTML = cryptTeams.length > 0 
                ? cryptTeams.map((t, i) => `${i+1}. ${t.name} <span class="queue-target">(Tgt: Flr ${t.targetFloor})</span>`).join('<span class="queue-arrow">➔</span>') 
                : "<em>The Crypt is empty</em>";

            // 2. Floor Callers
            let floorCallersHtml = "";
            for(let i = 1; i <= MAX_TOTAL_FLOORS; i++) {
                let currentCount = teams.filter(t => t.floor === i).length;
                let cap = floorCapacities[i-1];
                let isFull = currentCount >= cap;
                let nextTeam = teams.filter(t => t.floor === 0 && t.targetFloor === i).sort((a,b) => a.queueTime - b.queueTime)[0];

                let statusColor = isFull ? "#dc3545" : "#28a745";
                let statusText = `<span style="color:${statusColor}; font-weight:bold;">[ ${currentCount} / ${cap} ]</span>`;
                
                let btnState = "", btnClass = "", btnText = "";
                if (isFull) {
                    btnClass = "btn-disabled"; btnText = "Full"; btnState = "disabled";
                } else if (nextTeam) {
                    btnClass = "btn-call-ready"; btnText = `Call: ${nextTeam.name}`;
                } else {
                    btnClass = "btn-disabled"; btnText = "Empty Q"; btnState = "disabled";
                }

                floorCallersHtml += `
                    <div class="floor-call-row">
                        <span class="floor-call-name">${statusText} ${floorNames[i]}</span>
                        <button class="${btnClass}" ${btnState} onclick="callNextToFloor(${i})">${btnText}</button>
                    </div>
                `;
            }
            document.getElementById("floor-call-box").innerHTML = floorCallersHtml;

            // 3. Team Management Box
            let manualTeamsHtml = "";
            teams.forEach(t => {
                let currentFloorName = floorNames[t.floor] || `Floor ${t.floor}`;
                if (t.floor === 0) {
                    manualTeamsHtml += `
                        <div class="admin-team">
                            <button class="btn-tgt" onclick="changeTarget(${t.id}, -1)">- Tgt</button>
                            <input type="text" id="name-${t.id}" value="${t.name}" onchange="updateName(${t.id}, this.value)">
                            <span class="floor-label">Crypt ➔ Flr ${t.targetFloor}</span>
                            <button class="btn-tgt" onclick="changeTarget(${t.id}, 1)">+ Tgt</button>
                            <button class="btn-force" onclick="forceGo(${t.id})">Force</button>
                        </div>
                    `;
                } else {
                    manualTeamsHtml += `
                        <div class="admin-team">
                            <button class="btn-lose-room" onclick="loseRoom(${t.id})">💀 Lose</button>
                            <input type="text" id="name-${t.id}" value="${t.name}" onchange="updateName(${t.id}, this.value)">
                            <span class="floor-label">${currentFloorName}</span>
                            <button class="btn-win-room" onclick="winRoom(${t.id})">🎉 Win</button>
                            <button class="btn-overall-win" onclick="declareWinner(${t.id})">🏆</button>
                        </div>
                    `;
                }
            });
            document.getElementById("team-mgmt-box").innerHTML = manualTeamsHtml;
        }

        function winRoom(id) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.targetFloor = Math.max(1, team.floor - 1);
                team.floor = 0;
                team.queueTime = Date.now();
                saveState();
            }
        }

        function loseRoom(id) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.targetFloor = Math.min(MAX_TOTAL_FLOORS, team.floor + 1);
                team.floor = 0;
                team.queueTime = Date.now();
                saveState();
            }
        }

        function changeTarget(id, direction) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.targetFloor += direction;
                if (team.targetFloor < 1) team.targetFloor = 1;
                if (team.targetFloor > MAX_TOTAL_FLOORS) team.targetFloor = MAX_TOTAL_FLOORS;
                saveState();
            }
        }

        function forceGo(id) {
            const team = gameState.teams.find(t => t.id === id);
            if (team && team.targetFloor >= 1 && team.targetFloor <= MAX_TOTAL_FLOORS) {
                let currentCount = gameState.teams.filter(tm => tm.floor === team.targetFloor).length;
                let cap = floorCapacities[team.targetFloor - 1];

                if (currentCount >= cap) {
                    alert(`Cannot force ${team.name} to ${floorNames[team.targetFloor]}.\n\nThis floor is currently at its maximum capacity of ${cap}.`);
                    return; 
                }

                team.floor = team.targetFloor;
                if (team.floor > gameState.unlockedFloor) {
                    gameState.unlockedFloor = team.floor;
                }
                saveState();
            }
        }

        function callNextToFloor(floorNum) {
            const queuedTeams = gameState.teams.filter(t => t.floor === 0 && t.targetFloor === floorNum).sort((a,b) => a.queueTime - b.queueTime);
            if (queuedTeams.length > 0) {
                const nextTeam = queuedTeams[0];
                nextTeam.floor = floorNum;
                if (floorNum > gameState.unlockedFloor) {
                    gameState.unlockedFloor = floorNum;
                }
                saveState();
            }
        }

        function declareWinner(id) {
            const team = gameState.teams.find(t => t.id === id);
            if (confirm(`Are you sure you want to declare ${team.name} as the WINNER?`)) {
                gameState.winnerName = team.name;
                saveState();
            }
        }

        function updateName(id, newName) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.name = newName;
                saveState();
            }
        }

        function addTeam() {
            const teams = gameState.teams;
            const newId = teams.length ? Math.max(...teams.map(t => t.id)) + 1 : 1;
            teams.push({ id: newId, name: `Team ${newId}`, floor: 0, queueTime: Date.now(), targetFloor: 1 });
            saveState();
        }

        function resetGame() {
            if(confirm("Reset all teams to The Crypt, clear Fog of War, and reset Winner?")) {
                gameState.teams.forEach((t, i) => {
                    t.floor = 0;
                    t.targetFloor = 1;
                    t.queueTime = Date.now() + i;
                });
                gameState.unlockedFloor = 0;
                gameState.winnerName = null;
                saveState();
            }
        }

        // Realtime listener for cross-device sync
        dbClient
            .channel('public:game_state')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state' }, payload => {
                if (payload.new && payload.new.data) {
                    gameState = payload.new.data;
                    renderAdmin();
                }
            })
            .subscribe();

        // Initial Load
        fetchState();
    </script>
</body>
</html>
