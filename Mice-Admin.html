<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted House - Admin Dashboard</title>
    <!-- Include Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 15px; margin: 0; display: flex; justify-content: center; }
        
        #admin-panel { 
            background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.1); 
            width: 100%; max-width: 1440px; 
            display: flex; flex-direction: column; height: 93vh; box-sizing: border-box;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h2 { margin: 0; font-size: 20px; color: #222; }

        .btn-sync-toggle {
            background: #28a745;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .btn-sync-paused {
            background: #dc3545 !important;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 15px;
            flex: 1;
            overflow: hidden;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: calc(93vh - 80px);
            padding-right: 5px;
        }
        
        .admin-section { background: #e9ecef; padding: 12px; border-radius: 6px; }
        .section-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 6px; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
        .section-title { font-weight: bold; font-size: 15px; color: #333; }
        
        /* Floor Filter Bar for Room Hosts */
        .floor-filter-bar { display: flex; gap: 3px; flex-wrap: wrap; }
        .btn-filter { background: #dee2e6; color: #333; font-size: 11px; padding: 3px 7px; border-radius: 3px; border: 1px solid #ced4da; cursor: pointer; font-weight: bold; }
        .btn-filter-active { background: #0056b3 !important; color: #fff !important; border-color: #004085 !important; }

        /* Crypt Queue Styling */
        .queue-display { font-size: 13px; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; color: #555; line-height: 1.5; }
        .queue-item { display: inline-block; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; margin: 3px 0; vertical-align: middle; }
        .queue-item-blocked { border: 2px solid #dc3545 !important; background: #fff5f5 !important; box-shadow: 0 0 5px rgba(220, 53, 69, 0.35); }
        .blocked-badge { color: #dc3545; font-size: 10px; font-weight: bold; margin-left: 4px; }
        .queue-members { font-size: 11px; color: #0056b3; font-weight: normal; display: block; }
        .queue-arrow { color: #ff7518; margin: 0 6px; font-weight: bold; }
        .queue-target { font-size: 11px; color: #555; font-weight: bold; background: #e2e6ea; padding: 1px 5px; border-radius: 3px; margin-left: 3px; }
        
        /* Auto-Call Floor Cards */
        .floor-call-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .floor-call-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 8px 10px; border-radius: 4px; border: 1px solid #ccc; gap: 10px; }
        .floor-call-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .floor-call-name { font-weight: bold; font-size: 13px; color: #222; }
        .floor-occupants { font-size: 11px; color: #555; background: #f1f3f5; padding: 3px 6px; border-radius: 3px; border-left: 3px solid #6c757d; }
        
        .floor-incoming-box {
            margin-top: 2px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: #e8f5e9;
            border-left: 3px solid #28a745;
            color: #155724;
        }
        .floor-incoming-blocked {
            background: #fff5f5;
            border-left: 3px solid #dc3545;
            color: #721c24;
        }
        .floor-also-waiting {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
            font-weight: normal;
        }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        .btn-call-ready { background: #28a745; font-size: 11px; padding: 7px 10px; color: #fff; border: 1px solid #1e7e34; animation: pulse-green 2s infinite; font-weight: bold; border-radius: 3px; cursor: pointer; white-space: nowrap; }
        .btn-disabled { background: #6c757d; font-size: 11px; padding: 6px 8px; cursor: not-allowed; opacity: 0.6; border: none; color: #fff; font-weight: bold; border-radius: 3px; white-space: nowrap; }
        
        /* Team Management Cards with Large Location Square */
        .admin-team { display: flex; align-items: stretch; gap: 10px; margin-bottom: 8px; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid #ccc; transition: border 0.2s; }
        .admin-team-blocked { border: 2px solid #dc3545 !important; background: #fff8f8 !important; }
        
        /* Large Square Location Badge */
        .location-square {
            min-width: 92px;
            max-width: 92px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 6px 4px;
            color: #fff;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .loc-square-room { background: #0056b3; border: 2px solid #003d82; }
        .loc-square-crypt { background: #495057; border: 2px solid #343a40; }
        .loc-square-blocked { background: #dc3545; border: 2px solid #a71d2a; }
        
        .loc-square-main { font-size: 15px; font-weight: 900; letter-spacing: 0.5px; line-height: 1.1; }
        .loc-square-sub { font-size: 10px; font-weight: bold; opacity: 0.92; margin-top: 3px; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .admin-team-Main { display: flex; flex-direction: column; justify-content: space-between; gap: 6px; flex: 1; min-width: 0; }
        .admin-team-top { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 4px; }
        .admin-team-top input { flex: 1; min-width: 90px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .admin-team-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; flex-wrap: wrap; }
        .members-input { flex: 1; min-width: 140px; padding: 4px 6px; border: 1px dashed #bbb; border-radius: 4px; font-size: 11px; color: #333; background: #fafafa; }
        .members-input:focus { border-style: solid; border-color: #17a2b8; background: #fff; outline: none; }
        
        /* Discreet Room Visit Tracker & Dynamic Gradient Timer */
        .team-meta-row { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 10px; gap: 6px; flex-wrap: wrap; }
        .visit-history { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
        .visit-label { font-size: 10px; color: #888; font-weight: bold; margin-right: 2px; }
        .visit-pill { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: #e9ecef; color: #495057; border: 1px solid #ced4da; font-weight: bold; }
        .visit-pill-warn { background: #fff3cd; color: #856404; border-color: #ffeeba; }
        .visit-pill-danger { background: #f8d7da; color: #721c24; border-color: #f5c6cb; font-weight: bold; }
        
        .room-timer { font-weight: bold; padding: 2px 7px; border-radius: 3px; border: 1px solid #ced4da; white-space: nowrap; transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease; }

        button { cursor: pointer; padding: 6px 10px; font-weight: bold; color: white; border: none; border-radius: 3px; }
        
        .btn-win-room { background: #28a745; width: 68px; font-size: 12px; padding: 6px; }
        .btn-lose-room { background: #dc3545; width: 68px; font-size: 12px; padding: 6px; }
        .btn-tgt { background: #6c757d; width: 50px; font-size: 11px; padding: 6px 4px; }
        .btn-overall-win { background: #ffc107; color: #000; border: 1px solid #d39e00; font-size: 12px; padding: 5px 7px;}
        .btn-remove-team { background: #343a40; color: #fff; font-size: 11px; padding: 5px 7px; opacity: 0.85; }
        .btn-remove-team:hover { background: #c82333; opacity: 1; }
        
        .global-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-add { background: #17a2b8; flex: 1; padding: 8px; font-size: 13px; }
        .btn-reset { background: #ff7518; flex: 1; padding: 8px; font-size: 13px; }
    </style>
</head>
<body>
    <div id="admin-panel">
        <div class="header-bar">
            <h2>Admin Controls Dashboard (Cloud Synced)</h2>
            <button id="sync-toggle-btn" class="btn-sync-toggle" onclick="toggleSync()">⏸️ Pause Auto-Sync</button>
        </div>
        
        <div class="dashboard-grid">
            <div class="column">
                <div class="admin-section" style="background:#fff3cd; border: 1px solid #ffeeba;">
                    <div class="section-header-row">
                        <div class="section-title">The Crypt Queue (Red Outline = Target Room Full)</div>
                    </div>
                    <div class="queue-display" id="queue-box">Loading...</div>
                </div>

                <div class="admin-section">
                    <div class="section-header-row">
                        <div class="section-title">Auto-Call to Rooms & Incoming Lineup</div>
                    </div>
                    <div class="floor-call-grid" id="floor-call-box"></div>
                </div>
            </div>

            <div class="column">
                <div class="admin-section">
                    <div class="section-header-row">
                        <div class="section-title">Team Management & Outcomes</div>
                        <div class="floor-filter-bar" id="floor-filter-bar"></div>
                    </div>
                    <div id="team-mgmt-box"></div>
                </div>
            </div>
        </div>

        <div class="global-actions">
            <button class="btn-add" onclick="addTeam()">+ Add New Team</button>
            <button class="btn-reset" onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://alchlikgtmkpghujvgcn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsY2hsaWtndG1rcGdodWp2Z2NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0Mjc0MDcsImV4cCI6MjEwODAwMzQwN30.PUrYlqwiu1NflpUdz2OCj5_zen1MM3aH5vi5PGrp_E4';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const MAX_TOTAL_FLOORS = 8;
        const floorCapacities = [10, 10, 1, 2, 1, 1, 1, 2]; 
        
        const floorNames = [
            "The Crypt (Waiting Room)",
            "Floor 1: Count the Mice",
            "Floor 2: The Phantom's Parlor",
            "Floor 3: The Hall of Mirrors",
            "Floor 4: Accountability",
            "Floor 5: Ghoul's Toll",
            "Floor 6: Spot the Differences",
            "Floor 7: Spot the Similarities",
            "Floor 8: The Crypt Keeper's Truth"
        ];

        const shortFloorTitles = [
            "Waiting Room",
            "Count the Mice",
            "Phantom's Parlor",
            "Hall of Mirrors",
            "Accountability",
            "Ghoul's Toll",
            "Spot Differences",
            "Spot Similarities",
            "Crypt Keeper"
        ];

        let gameState = {
            teams: [],
            unlockedFloor: 0,
            winnerName: null
        };

        let isSyncPaused = false;
        let selectedFloorFilter = 'ALL'; // 'ALL', 'CRYPT', or floor number 1..8

        function setFloorFilter(filterVal) {
            selectedFloorFilter = filterVal;
            renderAdmin();
        }

        function toggleSync() {
            isSyncPaused = !isSyncPaused;
            const btn = document.getElementById('sync-toggle-btn');
            if (isSyncPaused) {
                btn.innerText = "▶️ Resume Auto-Sync (PAUSED)";
                btn.classList.add('btn-sync-paused');
            } else {
                btn.innerText = "⏸️ Pause Auto-Sync";
                btn.classList.remove('btn-sync-paused');
                fetchState(true); // Immediate sync upon resuming
            }
        }

        // Check if user is actively typing in any team name or member roster input
        function isTypingInInput() {
            const active = document.activeElement;
            return active && active.tagName === 'INPUT' && (active.id.startsWith('name-') || active.id.startsWith('members-'));
        }

        // Helper: check if a specific floor is currently at max capacity
        function isFloorAtCapacity(floorNum, teamsList) {
            if (floorNum < 1 || floorNum > MAX_TOTAL_FLOORS) return false;
            const currentCount = teamsList.filter(t => t.floor === floorNum).length;
            return currentCount >= floorCapacities[floorNum - 1];
        }

        // Helper: record a room visit for a team
        function recordVisit(team, floorNum) {
            if (!team.visits) team.visits = {};
            team.visits[floorNum] = (team.visits[floorNum] || 0) + 1;
        }

        // Helper: format elapsed time as MM:SS
        function formatDuration(ms) {
            if (!ms || isNaN(ms)) return "00:00";
            const totalSecs = Math.floor(ms / 1000);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // Helper: calculate gray -> yellow -> red gradient styling based on elapsed time (target 5 min = 300,000ms)
        function getTimerStyleAndClass(elapsedMs) {
            const targetMax = 300000; // 5 minutes
            const ratio = Math.min(Math.max(elapsedMs / targetMax, 0), 1);
            
            let bg, color, border;
            if (ratio <= 0.5) {
                // Gray to Yellow (0% to 50% of 5 mins)
                const subRatio = ratio * 2; // 0 to 1
                const r = Math.round(233 + (255 - 233) * subRatio);
                const g = Math.round(236 + (235 - 236) * subRatio);
                const b = Math.round(239 + (59 - 239) * subRatio);
                bg = `rgb(${r}, ${g}, ${b})`;
                color = subRatio > 0.4 ? '#533f00' : '#333';
                border = subRatio > 0.4 ? '#ffeeba' : '#ced4da';
            } else {
                // Yellow to Red (50% to 100% of 5 mins)
                const subRatio = (ratio - 0.5) * 2; // 0 to 1
                const r = Math.round(255 + (220 - 255) * subRatio);
                const g = Math.round(235 + (53 - 235) * subRatio);
                const b = Math.round(59 + (69 - 59) * subRatio);
                bg = `rgb(${r}, ${g}, ${b})`;
                color = subRatio > 0.3 ? '#fff' : '#533f00';
                border = subRatio > 0.3 ? '#a71d2a' : '#ffeeba';
            }
            if (ratio >= 1) {
                bg = '#dc3545';
                color = '#fff';
                border = '#a71d2a';
            }
            return `background-color: ${bg}; color: ${color}; border-color: ${border};`;
        }

        // Helper: render visit badges and live room timer
        function renderTeamMeta(team) {
            const visits = team.visits || {};
            const visitedFloors = Object.keys(visits).filter(f => visits[f] > 0).sort((a, b) => Number(a) - Number(b));
            
            const pills = visitedFloors.length > 0 ? visitedFloors.map(f => {
                const count = visits[f];
                let pillClass = "visit-pill";
                let prefix = "";
                if (count >= 3) {
                    pillClass += " visit-pill-danger";
                    prefix = "⚠️ ";
                } else if (count === 2) {
                    pillClass += " visit-pill-warn";
                }
                return `<span class="${pillClass}" title="${floorNames[f]}: visited ${count} time(s)">${prefix}F${f}: ${count}</span>`;
            }).join('') : `<span class="visit-label">Visits: None</span>`;

            // Calculate live timer
            const entered = team.enteredAt || Date.now();
            const elapsedMs = Date.now() - entered;
            const timeStr = formatDuration(elapsedMs);
            const inlineStyle = getTimerStyleAndClass(elapsedMs);
            const locationType = team.floor === 0 ? "Crypt Time" : `Flr ${team.floor} Time`;

            return `
                <div class="team-meta-row">
                    <div class="visit-history"><span class="visit-label">Visits:</span>${pills}</div>
                    <div class="room-timer" style="${inlineStyle}" id="timer-box-${team.id}" title="Time spent in current location">⏱️ ${locationType}: <span id="timer-${team.id}">${timeStr}</span></div>
                </div>
            `;
        }

        // Fetch state from Supabase on load or poll
        async function fetchState(force = false) {
            if (!force && (isSyncPaused || isTypingInInput())) {
                return; // Skip refresh while paused or actively typing
            }
            try {
                const { data, error } = await dbClient
                    .from('game_state')
                    .select('data')
                    .eq('id', 1)
                    .single();
                
                if (data && data.data) {
                    if (!force && (isSyncPaused || isTypingInInput())) return;
                    gameState = data.data;
                    renderAdmin();
                } else {
                    console.error("No data returned from Supabase:", error);
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        // Push updated state to Supabase
        async function saveState() {
            renderAdmin(); // Immediate local render for responsiveness
            await dbClient
                .from('game_state')
                .update({ data: gameState })
                .eq('id', 1);
        }

        function renderAdmin() {
            const teams = gameState.teams || [];
            
            // 0. Render Floor Filter Bar for Room Hosts
            let filterHtml = `
                <button class="btn-filter ${selectedFloorFilter === 'ALL' ? 'btn-filter-active' : ''}" onclick="setFloorFilter('ALL')">All</button>
                <button class="btn-filter ${selectedFloorFilter === 'CRYPT' ? 'btn-filter-active' : ''}" onclick="setFloorFilter('CRYPT')">Crypt</button>
            `;
            for (let i = 1; i <= MAX_TOTAL_FLOORS; i++) {
                filterHtml += `<button class="btn-filter ${selectedFloorFilter === i ? 'btn-filter-active' : ''}" onclick="setFloorFilter(${i})" title="${floorNames[i]}">F${i}</button>`;
            }
            document.getElementById("floor-filter-bar").innerHTML = filterHtml;

            // 1. Queue Box
            const cryptTeams = teams.filter(t => t.floor === 0).sort((a, b) => a.queueTime - b.queueTime);
            document.getElementById("queue-box").innerHTML = cryptTeams.length > 0 
                ? cryptTeams.map((t, i) => {
                    const targetFull = isFloorAtCapacity(t.targetFloor, teams);
                    const itemClass = targetFull ? "queue-item queue-item-blocked" : "queue-item";
                    const fullBadge = targetFull ? `<span class="blocked-badge">🔒 ROOM FULL</span>` : '';
                    const memberText = t.members ? `<span class="queue-members">👥 ${t.members}</span>` : '';
                    return `<div class="${itemClass}">${i+1}. ${t.name} <span class="queue-target">➔ Flr ${t.targetFloor}</span>${fullBadge}${memberText}</div>`;
                }).join('<span class="queue-arrow">➔</span>') 
                : "<em>The Crypt is empty</em>";

            // 2. Floor Callers
            let floorCallersHtml = "";
            for(let i = 1; i <= MAX_TOTAL_FLOORS; i++) {
                let currentTeamsOnFloor = teams.filter(t => t.floor === i);
                let currentCount = currentTeamsOnFloor.length;
                let cap = floorCapacities[i-1];
                let isFull = currentCount >= cap;
                
                let waitingForThisFloor = teams.filter(t => t.floor === 0 && t.targetFloor === i).sort((a,b) => a.queueTime - b.queueTime);
                let nextTeam = waitingForThisFloor[0];

                let statusColor = isFull ? "#dc3545" : "#28a745";
                let statusText = `<span style="color:${statusColor}; font-weight:bold;">[ ${currentCount} / ${cap} ]</span>`;
                
                let occupantInfo = currentTeamsOnFloor.length > 0
                    ? `<div class="floor-occupants">🟢 <strong>In Room:</strong> ${currentTeamsOnFloor.map(t => `<strong>${t.name}</strong>${t.members ? ` (${t.members})` : ''}`).join(', ')}</div>`
                    : '';

                let incomingHtml = "";
                if (waitingForThisFloor.length > 0) {
                    const boxClass = isFull ? "floor-incoming-box floor-incoming-blocked" : "floor-incoming-box";
                    const statusPrefix = isFull ? "🔒 <strong>WAITING (Room Full) — Next Up:</strong>" : "🔜 <strong>HEADED HERE NEXT:</strong>";
                    const nextMembers = nextTeam.members ? ` <span style="font-weight:normal;">(👥 ${nextTeam.members})</span>` : '';
                    
                    let othersHtml = "";
                    if (waitingForThisFloor.length > 1) {
                        const othersList = waitingForThisFloor.slice(1).map((t, idx) => `${idx + 2}. ${t.name}`).join(', ');
                        othersHtml = `<div class="floor-also-waiting">⏳ Also in line for Floor ${i}: ${othersList}</div>`;
                    }
                    incomingHtml = `
                        <div class="${boxClass}">
                            <div>${statusPrefix} <strong>${nextTeam.name}</strong>${nextMembers}</div>
                            ${othersHtml}
                        </div>
                    `;
                }

                let btnState = "", btnClass = "", btnText = "";
                if (isFull) {
                    btnClass = "btn-disabled";
                    btnText = waitingForThisFloor.length > 0 ? `Full (${waitingForThisFloor.length} Waiting)` : "Full";
                    btnState = "disabled";
                } else if (nextTeam) {
                    btnClass = "btn-call-ready";
                    btnText = `Call: ${nextTeam.name}`;
                } else {
                    btnClass = "btn-disabled";
                    btnText = "No One Queued";
                    btnState = "disabled";
                }

                floorCallersHtml += `
                    <div class="floor-call-row">
                        <div class="floor-call-info">
                            <span class="floor-call-name">${statusText} ${floorNames[i]}</span>
                            ${occupantInfo}
                            ${incomingHtml}
                        </div>
                        <button class="${btnClass}" ${btnState} onclick="callNextToFloor(${i})">${btnText}</button>
                    </div>
                `;
            }
            document.getElementById("floor-call-box").innerHTML = floorCallersHtml;

            // 3. Team Management Box
            let manualTeamsHtml = "";
            const filteredTeams = teams.filter(t => {
                if (selectedFloorFilter === 'ALL') return true;
                if (selectedFloorFilter === 'CRYPT') return t.floor === 0;
                return t.floor === selectedFloorFilter || (t.floor === 0 && t.targetFloor === selectedFloorFilter);
            });

            if (filteredTeams.length === 0) {
                manualTeamsHtml = `<div style="padding:15px; text-align:center; color:#666; background:#fff; border-radius:4px;"><em>No teams currently in or queued for this floor filter.</em></div>`;
            }

            filteredTeams.forEach(t => {
                let membersVal = (t.members || "").replace(/"/g, '&quot;');
                let teamMetaHtml = renderTeamMeta(t);

                if (t.floor === 0) {
                    const isBlocked = isFloorAtCapacity(t.targetFloor, teams);
                    const cardClass = isBlocked ? "admin-team admin-team-blocked" : "admin-team";
                    const squareClass = isBlocked ? "location-square loc-square-blocked" : "location-square loc-square-crypt";
                    const topLabel = isBlocked ? `🔒 FULL` : `CRYPT`;
                    const subLabel = `Next ➔ Flr ${t.targetFloor}`;

                    manualTeamsHtml += `
                        <div class="${cardClass}">
                            <div class="${squareClass}" title="Waiting in Crypt for ${floorNames[t.targetFloor]}">
                                <div class="loc-square-main">${topLabel}</div>
                                <div class="loc-square-sub">${subLabel}</div>
                            </div>
                            <div class="admin-team-Main">
                                <div class="admin-team-top">
                                    <button class="btn-tgt" onclick="changeTarget(${t.id}, -1)" title="Decrease Target Floor">- Tgt</button>
                                    <input type="text" id="name-${t.id}" value="${t.name}" onchange="updateName(${t.id}, this.value)" title="Team Name">
                                    <button class="btn-tgt" onclick="changeTarget(${t.id}, 1)" title="Increase Target Floor">+ Tgt</button>
                                    <button class="btn-remove-team" onclick="removeTeam(${t.id})" title="Remove Team">🗑️</button>
                                </div>
                                <div class="admin-team-bottom">
                                    <input type="text" class="members-input" id="members-${t.id}" value="${membersVal}" placeholder="👥 Add individual MS Teams names..." onchange="updateMembers(${t.id}, this.value)">
                                </div>
                                ${teamMetaHtml}
                            </div>
                        </div>
                    `;
                } else {
                    const shortRoom = shortFloorTitles[t.floor] || `Floor ${t.floor}`;
                    manualTeamsHtml += `
                        <div class="admin-team">
                            <div class="location-square loc-square-room" title="${floorNames[t.floor]}">
                                <div class="loc-square-main">FLR ${t.floor}</div>
                                <div class="loc-square-sub">${shortRoom}</div>
                            </div>
                            <div class="admin-team-Main">
                                <div class="admin-team-top">
                                    <button class="btn-lose-room" onclick="loseRoom(${t.id})">💀 Lose</button>
                                    <input type="text" id="name-${t.id}" value="${t.name}" onchange="updateName(${t.id}, this.value)" title="Team Name">
                                    <button class="btn-win-room" onclick="winRoom(${t.id})">🎉 Win</button>
                                    <button class="btn-overall-win" onclick="declareWinner(${t.id})" title="Declare Winner">🏆</button>
                                    <button class="btn-remove-team" onclick="removeTeam(${t.id})" title="Remove Team">🗑️</button>
                                </div>
                                <div class="admin-team-bottom">
                                    <input type="text" class="members-input" id="members-${t.id}" value="${membersVal}" placeholder="👥 Add individual MS Teams names..." onchange="updateMembers(${t.id}, this.value)">
                                </div>
                                ${teamMetaHtml}
                            </div>
                        </div>
                    `;
                }
            });
            document.getElementById("team-mgmt-box").innerHTML = manualTeamsHtml;
        }

        function winRoom(id) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.targetFloor = Math.max(1, team.floor - 1);
                team.floor = 0;
                team.enteredAt = Date.now(); // Reset timer on move
                team.queueTime = Date.now();
                saveState();
            }
        }

        function loseRoom(id) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.targetFloor = Math.min(MAX_TOTAL_FLOORS, team.floor + 1);
                team.floor = 0;
                team.enteredAt = Date.now(); // Reset timer on move
                team.queueTime = Date.now();
                saveState();
            }
        }

        function changeTarget(id, direction) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.targetFloor += direction;
                if (team.targetFloor < 1) team.targetFloor = 1;
                if (team.targetFloor > MAX_TOTAL_FLOORS) team.targetFloor = MAX_TOTAL_FLOORS;
                saveState();
            }
        }

        function callNextToFloor(floorNum) {
            const queuedTeams = gameState.teams.filter(t => t.floor === 0 && t.targetFloor === floorNum).sort((a,b) => a.queueTime - b.queueTime);
            if (queuedTeams.length > 0) {
                const nextTeam = queuedTeams[0];
                nextTeam.floor = floorNum;
                nextTeam.enteredAt = Date.now(); // Reset timer on move into room
                recordVisit(nextTeam, floorNum);
                if (floorNum > gameState.unlockedFloor) {
                    gameState.unlockedFloor = floorNum;
                }
                saveState();
            }
        }

        function declareWinner(id) {
            const team = gameState.teams.find(t => t.id === id);
            if (confirm(`Are you sure you want to declare ${team.name} as the WINNER?`)) {
                gameState.winnerName = team.name;
                saveState();
            }
        }

        function updateName(id, newName) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.name = newName;
                saveState();
            }
        }

        function updateMembers(id, newMembers) {
            const team = gameState.teams.find(t => t.id === id);
            if (team) {
                team.members = newMembers;
                saveState();
            }
        }

        function addTeam() {
            const teams = gameState.teams;
            const newId = teams.length ? Math.max(...teams.map(t => t.id)) + 1 : 1;
            teams.push({ id: newId, name: `Team ${newId}`, members: "", visits: {}, enteredAt: Date.now(), floor: 0, queueTime: Date.now(), targetFloor: 1 });
            saveState();
        }

        function removeTeam(id) {
            const team = gameState.teams.find(t => t.id === id);
            if (!team) return;
            if (confirm(`Are you sure you want to remove "${team.name}" from the game?`)) {
                gameState.teams = gameState.teams.filter(t => t.id !== id);
                if (gameState.winnerName === team.name) {
                    gameState.winnerName = null;
                }
                saveState();
            }
        }

        function resetGame() {
            if(confirm("Reset all teams to The Crypt, clear visit history & timers, and reset Winner? (Team names and member rosters will be kept)")) {
                gameState.teams.forEach((t, i) => {
                    t.floor = 0;
                    t.targetFloor = 1;
                    t.visits = {};
                    t.enteredAt = Date.now();
                    t.queueTime = Date.now() + i;
                });
                gameState.unlockedFloor = 0;
                gameState.winnerName = null;
                saveState();
            }
        }

        // Live 1-second ticker to update timer text and dynamic color gradient smoothly without full DOM rebuild
        setInterval(() => {
            if (!gameState || !gameState.teams) return;
            gameState.teams.forEach(t => {
                const timerSpan = document.getElementById(`timer-${t.id}`);
                const timerBox = document.getElementById(`timer-box-${t.id}`);
                if (timerSpan && timerBox && t.enteredAt) {
                    const elapsedMs = Date.now() - t.enteredAt;
                    timerSpan.innerText = formatDuration(elapsedMs);
                    timerBox.style.cssText = getTimerStyleAndClass(elapsedMs);
                }
            });
        }, 1000);

        // Realtime listener for cross-device sync
        dbClient
            .channel('public:game_state')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state' }, payload => {
                if (!isSyncPaused && !isTypingInInput() && payload.new && payload.new.data) {
                    gameState = payload.new.data;
                    renderAdmin();
                }
            })
            .subscribe();

        // Initial Load
        fetchState(true);
        // Fallback polling: checks for updates every 2 seconds if WebSockets are blocked
        setInterval(() => fetchState(false), 2000);
    </script>
</body>
</html>
