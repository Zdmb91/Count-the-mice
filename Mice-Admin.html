<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted House - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        #admin-panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        .admin-team { display: flex; align-items: center; margin-bottom: 10px; justify-content: space-between; background: #e9ecef; padding: 10px; border-radius: 4px;}
        .admin-team input { flex: 1; margin: 0 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .floor-label { width: 280px; text-align: left; padding-left: 10px; font-size: 13px; color: #444; font-weight: bold; }
        button { cursor: pointer; padding: 8px 12px; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 3px; }
        .btn-down { background: #dc3545; }
        .btn-add { background: #17a2b8; width: 100%; margin-top: 10px; padding: 12px; }
        .btn-reset { background: #ff7518; width: 100%; margin-top: 10px; padding: 12px; }
    </style>
</head>
<body>
    <div id="admin-panel">
        <h2>Admin Controls</h2>
        <div id="admin-teams-list"></div>
        <button class="btn-add" onclick="addTeam()">+ Add New Team</button>
        <button class="btn-reset" onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        const MAX_TOTAL_FLOORS = 8;
        
        const floorNames = [
            "The Crypt (Waiting Room)",
            "Floor 1: Count the Mice",
            "Floor 2: The Phantom's Violin",
            "Floor 3: The Hall of Mirrors",
            "Floor 4: Blindfolded Pumpkin Sculpting",
            "Floor 5: The Mirror Trap",
            "Floor 6: Spot the Differences",
            "Floor 7: Spot the Similarities",
            "Floor 8: The Crypt Keeper's Truth"
        ];

        let defaultTeams = Array.from({length: 8}, (_, i) => ({ id: i+1, name: `Team ${i+1}`, floor: 0 }));
        let teams = JSON.parse(localStorage.getItem('hauntedGameData')) || defaultTeams;

        function saveState() {
            localStorage.setItem('hauntedGameData', JSON.stringify(teams));
            renderAdmin();
        }

        function renderAdmin() {
            const admin = document.getElementById("admin-teams-list");
            admin.innerHTML = "";
            teams.forEach(t => {
                const row = document.createElement("div");
                row.className = "admin-team";
                let currentFloorName = floorNames[t.floor] || `Floor ${t.floor}`;
                row.innerHTML = `
                    <button class="btn-down" onclick="moveTeam(${t.id}, -1)">-</button>
                    <input type="text" value="${t.name}" onchange="updateName(${t.id}, this.value)">
                    <span class="floor-label">${currentFloorName}</span>
                    <button onclick="moveTeam(${t.id}, 1)">+</button>
                `;
                admin.appendChild(row);
            });
        }

        function moveTeam(id, direction) {
            const team = teams.find(t => t.id === id);
            if (team && (team.floor + direction) >= 0 && (team.floor + direction) <= MAX_TOTAL_FLOORS) {
                team.floor += direction;
                saveState();
            }
        }

        function updateName(id, newName) {
            const team = teams.find(t => t.id === id);
            if (team) {
                team.name = newName;
                saveState();
            }
        }

        function addTeam() {
            const newId = teams.length ? Math.max(...teams.map(t => t.id)) + 1 : 1;
            teams.push({ id: newId, name: `Team ${newId}`, floor: 0 });
            saveState();
        }

        function resetGame() {
            if(confirm("Reset all teams to Waiting Room?")) {
                teams.forEach(t => t.floor = 0);
                saveState();
            }
        }

        saveState();
    </script>
</body>
</html>
